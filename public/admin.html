<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal — STC Testing System</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23059669%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%230e7490%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Ctext%20x%3D%2732%27%20y%3D%2742%27%20font-family%3D%27Arial%2Csans-serif%27%20font-size%3D%2724%27%20font-weight%3D%27bold%27%20fill%3D%27white%27%20text-anchor%3D%27middle%27%3ESTC%3C%2Ftext%3E%3C%2Fsvg%3E">
</head>
<body>

<header class="site-header site-header-compact">
  <div class="header-inner">
    <div class="header-main">
      <div class="header-logo-chip"><img src="/stc-logo.webp" alt="STC logo" class="header-logo-img"></div>
      <div>
        <h1>Super Sys-Tech Computers Centre</h1>
        <p class="tagline">Admin / Exam Controller Portal &nbsp;|&nbsp; Empowering Skills Since 1997, Umerkot</p>
      </div>
    </div>
  </div>
</header>

<nav class="topbar">
  <span class="topbar-title">Admin / Exam Controller Portal</span>
  <a class="btn btn-small home-link" href="/">&larr; Back to Home</a>
  <span id="user-chip" class="user-chip"></span>
  <button id="btn-logout" class="btn btn-small hidden" type="button">Logout</button>
</nav>

<div id="toast" class="toast hidden" role="alert"></div>

<main id="main">
  <section id="view-login" class="view">
    <div class="card narrow login-card">
      <div class="login-badge">&#9881;</div>
      <h2>Admin Login</h2>
      <form id="login-form">
        <label>Username
          <input id="login-username" type="text" autocomplete="username" required>
        </label>
        <label>Password
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary btn-big" type="submit">Login</button>
      </form>
      <p id="login-error" class="login-error hidden"></p>
      <p class="demo-hint">Demo: <strong>admin / admin123</strong> (Danish Mustafa, Academic Administrator)</p>
    </div>
  </section>

  <section id="view-console" class="view hidden">
    <div id="console"></div>
  </section>
</main>

<div id="print-area"></div>

<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
